<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ngân hàng câu hỏi ôn tập Toán THPT - Cô Hồng Huệ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #ffffff);
      color: #1f2937;
      line-height: 1.6;
    }
    .banner {
      background: linear-gradient(135deg, #1d4ed8, #2563eb, #60a5fa);
      color: white;
      padding: 60px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .banner::before, .banner::after {
      content: "∫ π Σ √x f(x) Δ";
      position: absolute;
      font-size: 24px;
      opacity: 0.15;
      letter-spacing: 15px;
      white-space: nowrap;
    }
    .banner::before { top: 15px; left: 10px; }
    .banner::after { bottom: 15px; right: 10px; }
    
    .banner h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.3;
      max-width: 900px;
      margin-inline: auto;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }

    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .topic-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #dbeafe;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .topic-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.1);
    }

    .topic-header {
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }
    .topic-number {
      width: 42px; height: 42px; min-width: 42px;
      border-radius: 10px; background: #2563eb; color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px;
    }
    .topic-title { font-size: 17px; font-weight: 600; color: #1e3a8a; flex: 1; }

    .topic-options {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #f0f7ff;
      flex-direction: column;
      gap: 12px;
    }
    .topic-options.show { display: flex; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .option-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 14px;
    }

    .theory-btn {
      background: #2563eb;
      color: white;
      border: 1px solid #1d4ed8;
    }

    .exercise-section {
      background: #f8fafc;
      padding: 15px;
      border-radius: 15px;
      border: 1px dashed #cbd5e1;
    }
    .exercise-title {
      font-size: 13px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 10px;
    }
    .exercise-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sub-btn {
      background: white;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    .exam-btn {
      grid-column: span 2;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    /* CSS riêng cho mục Luyện Đề */
    .exam-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }
    .exam-name { font-weight: 600; font-size: 14px; color: #1e3a8a; }
    .exam-actions { display: flex; gap: 5px; }
    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .btn-de { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .btn-da { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

    footer {
      margin-top: 60px; background: #1e3a8a; color: white;
      text-align: center; padding: 40px 20px; line-height: 1.8;
    }

    @media (max-width: 600px) {
      .banner h1 { font-size: 20px; }
      .exercise-grid { grid-template-columns: 1fr; }
      .sub-btn, .exam-btn { grid-column: span 1; }
      .exam-list-item { flex-direction: column; gap: 10px; align-items: flex-start; }
      .exam-actions { width: 100%; justify-content: space-between; }
      .exam-actions a { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="banner">
    <h1>NGÂN HÀNG CÂU HỎI ÔN TẬP TOÁN THPT<br>THEO LỘ TRÌNH CÁ NHÂN HÓA</h1>
  </header>

  <main class="container">
    <div class="topics-grid" id="main-grid"></div>
  </main>

  <footer>
    <div style="font-size: 18px; margin-bottom: 10px;">ÔN TẬP THI TỐT NGHIỆP THPT 2026</div>
    <div style="font-weight: 300;">GV thực hiện: <span style="font-weight: 600;">PHAN HỒNG HUỆ</span></div>
    <div style="font-weight: 300; opacity: 0.9;">Trường THPT Anh Hùng Núp</div>
  </footer>

  <script>
    const topics = [
      'Ứng dụng đạo hàm và khảo sát hàm số',
      'Thống kê',
      'Vectơ trong không gian',
      'Nguyên hàm, tích phân, ứng dụng',
      'Phương pháp tọa độ trong không gian',
      'Xác suất',
      'Hình học không gian',
      'Dãy số - Cấp số cộng - Cấp số nhân',
      'Lượng giác',
      'Lý thuyết đồ thị',
      'Phương trình, bất phương trình',
      'LUYỆN GIẢI ĐỀ' // Mục số 12
    ];

    const grid = document.getElementById('main-grid');

    grid.innerHTML = topics.map((title, i) => {
      const id = i + 1;
      
      // Nếu là mục số 12 (Luyện giải đề)
      if (id === 12) {
        let examHtml = '';
        for(let j = 1; j <= 5; j++) {
          examHtml += `
            <div class="exam-list-item">
              <span class="exam-name">Đề ôn tập số ${j}</span>
              <div class="exam-actions">
                <a href="de${j}.pdf" target="_blank" class="btn-small btn-de">📄 Xem Đề</a>
                <a href="dapan${j}.pdf" target="_blank" class="btn-small btn-da">🔑 Đáp án</a>
              </div>
            </div>
          `;
        }
        
        return `
          <div class="topic-card" style="border: 2px solid #2563eb;">
            <div class="topic-header" onclick="toggleOptions(${id})">
              <div class="topic-number" style="background: #e11d48;">${id}</div>
              <div class="topic-title" style="color: #e11d48;">${title}</div>
            </div>
            <div class="topic-options" id="options-${id}">
              <div class="exercise-section" style="background: #fff1f2; border-color: #fecdd3;">
                <div class="exercise-title" style="color: #be123c;">📚 DANH SÁCH ĐỀ THI THỬ:</div>
                ${examHtml}
              </div>
            </div>
          </div>
        `;
      }

      // Các mục từ 1-11
      return `
        <div class="topic-card">
          <div class="topic-header" onclick="toggleOptions(${id})">
            <div class="topic-number">${id}</div>
            <div class="topic-title">${title}</div>
          </div>
          <div class="topic-options" id="options-${id}">
            <a class="option-btn theory-btn" href="ly_thuyet_${id}.pdf" target="_blank">📘 Xem lại lý thuyết</a>
            <div class="exercise-section">
              <div class="exercise-title">✍️ Giải bài tập theo dạng:</div>
              <div class="exercise-grid">
                <a class="option-btn sub-btn" href="chu_de_${id}_dang_1.pdf" target="_blank">Dạng 1: Nhiều lựa chọn</a>
                <a class="option-btn sub-btn" href="chu_de_${id}_dang_2.pdf" target="_blank">Dạng 2: Đúng / Sai</a>
                <a class="option-btn sub-btn" href="chu_de_${id}_dang_3.pdf" target="_blank">Dạng 3: Trả lời ngắn</a>
                <a class="option-btn sub-btn exam-btn" href="chu_de_${id}_dethi.pdf" target="_blank">🎯 Đề tổng hợp chủ đề</a>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    function toggleOptions(id) {
      const el = document.getElementById(`options-${id}`);
      el.classList.toggle('show');
    }
  </script>
</body>
</html>
